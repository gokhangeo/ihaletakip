<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İhale ve Personel Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .table-container { max-height: 60vh; overflow-y: auto; overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        .sticky-header { position: sticky; top: 0; z-index: 20; }
        .district-row { border-left: 4px solid transparent; transition: all 0.2s; }
        .district-ANAMUR { border-left-color: #3b82f6; }
        .district-BOZYAZI { border-left-color: #10b981; }
        .district-SİLİFKE { border-left-color: #f59e0b; }
        .district-GÜLNAR { border-left-color: #8b5cf6; }
        .district-AYDINCIK { border-left-color: #ef4444; }
        
        .editable-cell:focus { outline: 2px solid #3b82f6; background-color: #fff; border-radius: 4px; }
        
        select { background: transparent; border: none; cursor: pointer; width: 100%; }
        select:focus { outline: none; background: #fff; box-shadow: 0 0 0 2px #3b82f6; border-radius: 4px;}
        
        .stat-card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
        .stat-card:hover { transform: translateY(-2px); border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .stat-card.active-filter { border-color: #6366f1; box-shadow: 0 0 0 2px #6366f1; background-color: #fefce8; }
        
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(100%); opacity: 0; }
        #toast.show { transform: translateY(0); opacity: 1; }
        
        /* Gizli scrollbar için yardımcı */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-2 md:p-6 text-slate-800">

<div class="max-w-[1600px] mx-auto">
    <header class="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div id="titleContainer" class="cursor-pointer select-none">
                <h1 class="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                    İhale Takip Sistemi <span id="adminBadge" class="hidden text-[10px] bg-red-600 text-white px-2 py-1 rounded-md font-bold uppercase tracking-widest">Admin Modu</span>
                </h1>
                <p class="text-slate-500 text-xs md:text-sm mt-1">Personel görev dağılımı ve iş yükü analiz paneli</p>
            </div>
        </div>
        
        <div class="flex flex-wrap gap-2 md:gap-3 w-full xl:w-auto">
            <div class="relative flex-grow xl:flex-grow-0">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="globalSearch" placeholder="İlçe veya Mahalle ara..." 
                       class="pl-9 pr-3 py-2 w-full xl:w-64 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            
            <!-- Admin'e Özel Butonlar -->
            <div id="adminControls" class="hidden flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="fetchFromGithub()" class="bg-blue-600 text-white px-3 py-2 rounded-xl hover:bg-blue-700 transition flex items-center gap-1.5 text-sm font-semibold whitespace-nowrap">
                    <i class="fas fa-cloud-download-alt"></i> Çek
                </button>
                <button onclick="saveToGithub()" class="bg-indigo-600 text-white px-3 py-2 rounded-xl hover:bg-indigo-700 transition flex items-center gap-1.5 text-sm font-semibold whitespace-nowrap">
                    <i class="fas fa-cloud-upload-alt"></i> Kaydet
                </button>
                <button onclick="resetData()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl hover:bg-red-50 hover:text-red-600 transition flex items-center gap-1.5 text-sm font-medium whitespace-nowrap">
                    <i class="fas fa-undo"></i> Sıfırla
                </button>
            </div>
            
            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-3 py-2 rounded-xl hover:bg-emerald-700 transition flex items-center gap-1.5 text-sm font-semibold whitespace-nowrap">
                <i class="fas fa-file-excel"></i> İndir
            </button>
        </div>
    </header>

    <div id="activeFilterBanner" class="hidden mb-4 bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-3 rounded-xl flex justify-between items-center shadow-sm">
        <div class="text-sm font-medium">
            <i class="fas fa-filter mr-2"></i> Şuan filtrelenen personel: <strong id="filterNameDisplay" class="ml-1 text-indigo-900 bg-indigo-200/50 px-2 py-0.5 rounded"></strong>
        </div>
        <button onclick="togglePersonFilter(activePersonFilter)" class="text-indigo-600 hover:text-indigo-900 bg-white px-3 py-1 rounded-lg text-xs font-bold shadow-sm border border-indigo-100">
            Filtreyi Temizle <i class="fas fa-times ml-1"></i>
        </button>
    </div>

    <div class="mb-4 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <button onclick="toggleRegion('region1')" class="w-full px-6 py-4 bg-slate-50 flex justify-between items-center hover:bg-slate-100 transition-colors">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold"><i class="fas fa-map-marker-alt"></i></div>
                <h2 class="text-lg font-bold text-slate-800">Anamur - Bozyazı Bölgesi</h2>
            </div>
            <i id="icon-region1" class="fas fa-chevron-down text-slate-400 transition-transform"></i>
        </button>
        
        <div id="content-region1" class="p-6 hidden border-t border-slate-200 bg-white">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-user-tie text-blue-500"></i> Mühendisler</h3>
                    <div id="reg1-engStats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-tools text-purple-500"></i> Teknikerler</h3>
                    <div id="reg1-techStats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <button onclick="toggleRegion('region2')" class="w-full px-6 py-4 bg-slate-50 flex justify-between items-center hover:bg-slate-100 transition-colors">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold"><i class="fas fa-map-marker-alt"></i></div>
                <h2 class="text-lg font-bold text-slate-800">Silifke - Gülnar - Aydıncık Bölgesi</h2>
            </div>
            <i id="icon-region2" class="fas fa-chevron-down text-slate-400 transition-transform"></i>
        </button>
        
        <div id="content-region2" class="p-6 hidden border-t border-slate-200 bg-white">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-user-tie text-amber-500"></i> Mühendisler</h3>
                    <div id="reg2-engStats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-tools text-emerald-500"></i> Teknikerler</h3>
                    <div id="reg2-techStats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="table-container">
            <table class="w-full text-xs text-left border-collapse" id="mainTable">
                <thead class="sticky-header bg-slate-900 text-white shadow-md">
                    <tr>
                        <th class="p-3 font-bold whitespace-nowrap">S.N.</th>
                        <th class="p-3 font-bold whitespace-nowrap">İlçe</th>
                        <th class="p-3 font-bold whitespace-nowrap min-w-[120px]">Mahalle</th>
                        <th class="p-3 font-bold text-center whitespace-nowrap" title="Toplam Parsel Sayısı">T. Parsel</th>
                        <th class="p-3 font-bold text-center whitespace-nowrap">İDÖ</th>
                        <th class="p-3 font-bold text-center whitespace-nowrap">22-A</th>
                        <th class="p-3 font-bold text-center whitespace-nowrap">EK-1</th>
                        <th class="p-3 font-bold text-center whitespace-nowrap" title="Kadastro Yönüyle İşleme Tabi Parsel Sayısı">Kad. İşlem</th>
                        <th class="p-4 font-bold text-center bg-emerald-700/40 whitespace-nowrap" title="İhaleye Çıkılacak Toplam Parsel Sayısı">İhale Parsel</th>
                        <th class="p-4 font-bold bg-slate-800/80 whitespace-nowrap text-center">Görevli Personeller</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-5 right-5 md:right-10 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50">
    <div id="toastIcon" class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center"><i class="fas fa-check"></i></div>
    <div class="flex flex-col">
        <span id="toastTitle" class="font-bold text-sm">Başarılı</span>
        <span id="toastMsg" class="text-xs text-slate-300">İşlem tamamlandı.</span>
    </div>
</div>

<script>
// GitHub Ayarları
const GITHUB_TOKEN = 'ghp_' + '1Im4128xUP1uC8Oov8yBd7oahk2S6a0aGBTj'; // Parçalanmış Token
const GITHUB_REPO = 'gokhangeo/ihaletakip';
const GITHUB_FILE_PATH = 'data.json';

// Admin Ayarları
let isAdmin = false;
let clickCount = 0;
let clickTimer;
let activePersonFilter = null;
let saveTimeout;

const personnel = {
    muhendis: ["TEVFİK YILDIZ", "HİLMİ MÜFTÜOĞLU", "HİKMET GÜLCAN", "MEHTAP AKDOĞAN", "VOLKAN İZCİ"],
    tekniker: ["MUSTAFA BAYSAL", "SÜLEYMAN YILMAZ", "HÜSEYİN BÜYÜK", "BARIŞ YAYLAGÜL", "KAYHAN KARTPAK", "ÖMER ÇEVİK", "SERDAR ŞAHİN", "CANER OKAY"],
    kadastro: ["MEHMET AKDENİZ"],
    fen: ["MAHMUT GÖK", "MÜMİN AKDOĞAN"],
    tas: ["MUSTAFA BICAK"]
};

let data = [];

document.getElementById('titleContainer').addEventListener('click', () => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => clickCount = 0, 1500);
    
    if (clickCount >= 5) {
        clickCount = 0;
        if (!isAdmin) {
            let pass = prompt("Yönetici Şifresi:");
            if (pass === "5034") {
                isAdmin = true;
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('adminControls').classList.remove('hidden');
                showToast("Admin Modu Aktif", "Değişiklik yapabilirsiniz.", "success");
                renderTable();
            } else {
                alert("Hatalı şifre!");
            }
        } else {
            isAdmin = false;
            document.getElementById('adminBadge').classList.add('hidden');
            document.getElementById('adminControls').classList.add('hidden');
            showToast("İzleme Modu", "Admin yetkileri kapatıldı.", "info");
            renderTable();
        }
    }
});

async function fetchFromGithub(isAuto = false) {
    try {
        if(!isAuto) showToast("Bağlanıyor...", "GitHub'dan veriler çekiliyor.", "info");
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        
        if (res.ok) {
            const fileData = await res.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            let parsedData = JSON.parse(content);
            
            // Veri temizliği (M. BAYSAL -> MUSTAFA BAYSAL) ve Undefined Kontrolü
            let dataChanged = false;
            parsedData = parsedData.map(item => {
                if(item.tekniker === "M. BAYSAL") {
                    item.tekniker = "MUSTAFA BAYSAL";
                    dataChanged = true;
                }
                
                // GitHub'daki eski json dosyasında eksik/undefined olan verileri 0'a çevirir
                const numFields = ['toplam_parsel', 'ido', 'yirmi_iki_a', 'ek_1', 'kadastro_islem', 'parsel'];
                numFields.forEach(field => {
                    if (item[field] === undefined || item[field] === null || item[field] === "undefined" || isNaN(item[field]) || item[field] === "") {
                        item[field] = 0;
                        dataChanged = true;
                    }
                });

                return item;
            });
            
            data = parsedData;
            localStorage.setItem('ihaleData', JSON.stringify(data));
            localStorage.setItem('githubSha', fileData.sha);
            
            if(!isAuto) showToast("Başarılı", "Veriler güncellendi.", "success");
            renderTable(document.getElementById('globalSearch').value);
            
            // Eğer eski eksik veriler (undefined) 0 yapılarak düzeltildiyse Github'ı da onar
            if(dataChanged) saveToGithub(true);
            
        } else if (res.status === 404) {
            data = [];
            showToast("Bilgi", "GitHub'da data.json bulunamadı. Lütfen yeni veri kaydedin.", "info");
            renderTable();
        }
    } catch (e) {
        console.error("Github çekme hatası:", e);
        if(!isAuto) showToast("Hata", "Ağ hatası. Yerel veri kullanılıyor.", "error");
        data = JSON.parse(localStorage.getItem('ihaleData')) || [];
        renderTable();
    }
}

async function saveToGithub(isAuto = false) {
    if (!isAdmin && !isAuto) return;
    try {
        if(!isAuto) showToast("Kaydediliyor...", "GitHub'a gönderiliyor.", "info");
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const sha = localStorage.getItem('githubSha');
        
        const body = {
            message: `Update data via Panel - ${new Date().toLocaleString()}`,
            content: content
        };
        if (sha) body.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            const resData = await res.json();
            localStorage.setItem('githubSha', resData.content.sha);
            if(!isAuto) showToast("Kaydedildi", "Bulut verileri güncellendi.", "success");
        } else {
            throw new Error('API Hatası');
        }
    } catch (e) {
        console.error(e);
        if(!isAuto) showToast("Hata", "Buluta kaydedilemedi!", "error");
    }
}

function showToast(title, msg, type = "success") {
    const toast = document.getElementById('toast');
    document.getElementById('toastTitle').innerText = title;
    document.getElementById('toastMsg').innerText = msg;
    const icon = document.getElementById('toastIcon');
    
    icon.className = `w-8 h-8 rounded-full flex items-center justify-center ${type === 'error' ? 'bg-red-500' : type === 'info' ? 'bg-blue-500' : 'bg-emerald-500'}`;
    icon.innerHTML = `<i class="fas ${type === 'error' ? 'fa-times' : type === 'info' ? 'fa-info' : 'fa-check'}"></i>`;
    
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function toggleRegion(regionId) {
    const content = document.getElementById(`content-${regionId}`);
    const icon = document.getElementById(`icon-${regionId}`);
    if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
    } else {
        content.classList.add('hidden');
        icon.classList.remove('rotate-180');
    }
}

function togglePersonFilter(personName) {
    if (activePersonFilter === personName) {
        activePersonFilter = null;
        document.getElementById('activeFilterBanner').classList.add('hidden');
    } else {
        activePersonFilter = personName;
        document.getElementById('filterNameDisplay').innerText = personName;
        document.getElementById('activeFilterBanner').classList.remove('hidden');
    }
    
    document.getElementById('globalSearch').value = "";
    renderTable();
}

function createSelect(currentValue, list, sn, field, roleLabel) {
    const roleSpan = `<span class="text-[10px] text-slate-500 font-medium ml-1 shrink-0">(${roleLabel})</span>`;
    
    if (!isAdmin) {
        return `<div class="flex items-center justify-between py-1 border-b border-slate-100 last:border-0 hover:bg-slate-50/50 rounded px-1">
            <span class="font-bold text-slate-700 text-[11px] truncate">${currentValue}</span> ${roleSpan}
        </div>`;
    } 
    
    let options = list.map(name => `<option value="${name}" ${name === currentValue ? 'selected' : ''}>${name}</option>`).join('');
    return `<div class="flex items-center justify-between py-0.5 border-b border-slate-100 last:border-0 hover:bg-white rounded px-1 group">
        <select onchange="updateValue(${sn}, '${field}', this.value)" class="w-full font-bold text-[11px] outline-none bg-transparent cursor-pointer text-blue-700 group-hover:text-blue-800">${options}</select> 
        ${roleSpan}
    </div>`;
}

function renderTable(searchText = "") {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = "";

    const filtered = data.filter(item => {
        const matchesSearch = item.ilce.toLowerCase().includes(searchText.toLowerCase()) || item.mahalle.toLowerCase().includes(searchText.toLowerCase());
        const matchesPerson = !activePersonFilter || 
            [item.muhendis, item.tekniker, item.kadastro, item.fen, item.tas].includes(activePersonFilter);
        return matchesSearch && matchesPerson;
    });

    const editableClass = isAdmin ? "editable-cell cursor-text hover:bg-slate-100" : "";
    const editableAttr = isAdmin ? 'contenteditable="true"' : '';

    filtered.forEach(item => {
        const row = document.createElement('tr');
        row.className = `district-row district-${item.ilce} hover:bg-slate-50/80 transition-colors group`;
        
        row.innerHTML = `
            <td class="p-3 text-slate-400 font-medium text-center">${item.sn}</td>
            <td class="p-3 font-bold text-slate-700">${item.ilce}</td>
            <td class="p-3 font-semibold text-blue-600 truncate max-w-[150px]" title="${item.mahalle}">${item.mahalle}</td>
            
            <td class="p-3 text-center text-slate-600 font-medium ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'toplam_parsel', this.innerText)">${item.toplam_parsel !== undefined ? item.toplam_parsel : 0}</td>
            <td class="p-3 text-center text-slate-600 font-medium ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'ido', this.innerText)">${item.ido !== undefined ? item.ido : 0}</td>
            <td class="p-3 text-center text-slate-600 font-medium ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'yirmi_iki_a', this.innerText)">${item.yirmi_iki_a !== undefined ? item.yirmi_iki_a : 0}</td>
            <td class="p-3 text-center text-slate-600 font-medium ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'ek_1', this.innerText)">${item.ek_1 !== undefined ? item.ek_1 : 0}</td>
            <td class="p-3 text-center text-slate-600 font-medium ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'kadastro_islem', this.innerText)">${item.kadastro_islem !== undefined ? item.kadastro_islem : 0}</td>
            <td class="p-4 text-center font-black text-slate-800 bg-emerald-50 ${editableClass}" ${editableAttr} onblur="updateValue(${item.sn}, 'parsel', this.innerText)">${(item.parsel || 0).toLocaleString('tr-TR')}</td>
            
            <td class="p-1 align-top bg-slate-50/40 min-w-[260px]">
                <div class="flex flex-col">
                    ${createSelect(item.muhendis, personnel.muhendis, item.sn, 'muhendis', 'Mühendis')}
                    ${createSelect(item.tekniker, personnel.tekniker, item.sn, 'tekniker', 'Tekniker')}
                    ${createSelect(item.kadastro, personnel.kadastro, item.sn, 'kadastro', 'Kad. Üyesi')}
                    ${createSelect(item.fen, personnel.fen, item.sn, 'fen', 'Fen Kon.')}
                    ${createSelect(item.tas, personnel.tas, item.sn, 'tas', 'Tas. Kon.')}
                </div>
            </td>
        `;
        tableBody.appendChild(row);
    });

    calculateStats();
}

function calculateStats() {
    const region1Districts = ["ANAMUR", "BOZYAZI"];
    const region2Districts = ["SİLİFKE", "GÜLNAR", "AYDINCIK"];

    const r1Eng = {}, r1Tech = {};
    const r2Eng = {}, r2Tech = {};

    data.forEach(item => {
        const p = parseInt(item.parsel) || 0;
        const dist = item.ilce;
        
        const updateMap = (map, person) => {
            if (!map[person]) map[person] = { total: 0, details: {} };
            map[person].total += p;
            if (!map[person].details[dist]) map[person].details[dist] = { parsel: 0, count: 0 };
            map[person].details[dist].parsel += p;
            map[person].details[dist].count += 1;
        };

        if (region1Districts.includes(dist)) {
            updateMap(r1Eng, item.muhendis);
            updateMap(r1Tech, item.tekniker);
        } else if (region2Districts.includes(dist)) {
            updateMap(r2Eng, item.muhendis);
            updateMap(r2Tech, item.tekniker);
        }
    });

    const buildCards = (mapContainer, domId) => {
        const html = Object.entries(mapContainer).sort((a, b) => b[1].total - a[1].total).map(([name, data]) => {
            const isActive = activePersonFilter === name ? 'active-filter' : '';
            const checkIcon = isActive ? '<i class="fas fa-check-circle text-indigo-500 float-right"></i>' : '';
            
            const detailsHtml = Object.entries(data.details).sort((a, b) => b[1].parsel - a[1].parsel).map(([ilce, stats]) => `
                <div class="flex justify-between items-center text-[10px] py-1 border-b border-slate-100 last:border-0" title="${stats.count} adet mahalle/iş birimi">
                    <span class="text-slate-500 font-medium">${ilce} <span class="text-slate-400 font-normal">(${stats.count} Birim)</span></span>
                    <span class="font-bold text-indigo-600">${stats.parsel.toLocaleString('tr-TR')}</span>
                </div>
            `).join('');

            return `
            <div onclick="togglePersonFilter('${name}')" class="stat-card p-4 shadow-sm ${isActive}">
                ${checkIcon}
                <div class="text-xs font-bold text-slate-500 uppercase mb-1">${name}</div>
                <div class="text-xl font-black text-slate-800 mb-3">${data.total.toLocaleString('tr-TR')} <span class="text-[10px] font-normal text-slate-400 italic">parsel</span></div>
                <div class="bg-slate-50 rounded-lg p-2 border border-slate-100">${detailsHtml}</div>
            </div>`;
        }).join('');
        document.getElementById(domId).innerHTML = html;
    };

    buildCards(r1Eng, 'reg1-engStats');
    buildCards(r1Tech, 'reg1-techStats');
    buildCards(r2Eng, 'reg2-engStats');
    buildCards(r2Tech, 'reg2-techStats');
}

function updateValue(sn, field, newValue) {
    if (!isAdmin) return;
    const item = data.find(d => d.sn === sn);
    if (item) {
        if (['toplam_parsel', 'ido', 'yirmi_iki_a', 'ek_1', 'kadastro_islem', 'parsel'].includes(field)) {
            item[field] = parseInt(newValue.replace(/[^0-9]/g, '')) || 0;
        } else {
            item[field] = newValue.trim();
        }
        
        localStorage.setItem('ihaleData', JSON.stringify(data));
        
        // Tabloyu yeniden çiz ama odağı kaybetmemek için tüm sayfayı değil
        if (!['toplam_parsel', 'ido', 'yirmi_iki_a', 'ek_1', 'kadastro_islem', 'parsel'].includes(field)) {
            renderTable(document.getElementById('globalSearch').value);
        } else {
            calculateStats();
        }

        // Otomatik kaydetme (Debounce)
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => saveToGithub(true), 3000);
    }
}

function resetData() {
    if (confirm("Ekranda yaptığınız tüm değişiklikler iptal edilecek ve GitHub'daki en son kayıtlı veriler çekilecek. Onaylıyor musunuz?")) {
        fetchFromGithub(false);
        showToast("Yenileniyor", "GitHub'dan veriler çekiliyor...", "info");
    }
}

function exportToExcel() {
    let csv = "S.N;İlçe;Mahalle;Toplam Parsel;İDÖ;22-A;EK-1;Kadastro İşlem;İhale Parseli;Mühendis;Tekniker;Kadastro Üyesi;Fen Kontrol;Tas. Kontrol\n";
    data.forEach(r => {
        csv += `${r.sn};${r.ilce};${r.mahalle};${r.toplam_parsel};${r.ido};${r.yirmi_iki_a};${r.ek_1};${r.kadastro_islem};${r.parsel};${r.muhendis};${r.tekniker};${r.kadastro};${r.fen};${r.tas}\n`;
    });
    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Ihale_Takip_${new Date().toLocaleDateString('tr-TR')}.csv`;
    a.click();
}

document.getElementById('globalSearch').addEventListener('input', (e) => renderTable(e.target.value));

window.onload = () => {
    // Sayfa açılışında Github'dan çekmeyi dene
    fetchFromGithub(true).then(() => {
        // İlk açılışta 1. bölgeyi açık bırakalım örnek olarak
        toggleRegion('region1');
    });
};
</script>
